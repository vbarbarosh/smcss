# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # The same npm as the publish job installs with: what differs between
    # npm versions then shows on a push, before a release tag
    - run: npm install -g npm@latest
    - run: npm ci
    - run: npm run build
    - name: Check committed dist and demos/demo.css are up to date with src
      run: |
        git add -A dist demos/demo.css
        git diff --cached --exit-code -- dist demos/demo.css
    - run: npm test
